[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "authv4"
version = "4.0.2"
description = "Authris license client SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Authris" }]
keywords = ["licensing", "drm", "auth", "hwid"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
files = ["cryptography"]

[project.urls]
Homepage = "https://github.com/V12KLT/authris-sdk"
Documentation = "https://github.com/V12KLT/authris-sdk/blob/main/sdk/INTEGRATION.md"
Repository = "https://github.com/V12KLT/authris-sdk"

[tool.setuptools]
py-modules = ["authv4"]
